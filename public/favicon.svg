<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Outer circular frame -->
  <circle cx="60" cy="60" r="56" fill="url(#circleGrad)" stroke="#CBD5E1" stroke-width="4.5"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Left architectural square with vertical column/cross section -->
  <g transform="translate(25, 45)">
    <!-- Square boundary -->
    <rect x="0" y="0" width="28" height="28" rx="2" fill="none" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Vertical structural center line / pillar -->
    <line x1="14" y1="-5" x2="14" y2="33" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <!-- Center mark tick -->
    <line x1="8" y1="14" x2="20" y2="14" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- The stylized 'R' mark -->
  <g transform="translate(42, 32)">
    <!-- R vertical stroke & curved bowl & angled beam -->
    <path d="M 12 10 L 12 44" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <!-- R top bowl -->
    <path d="M 12 10 C 26 10, 36 12, 36 24 C 36 34, 26 36, 12 36" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- R diagonal architectural leg slashing through and down -->
    <path d="M 23 34 L 46 58" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <!-- Technical compass point / measurement accent -->
    <circle cx="46" cy="58" r="2.5" fill="#E11D48"/>
  </g>
</svg>
